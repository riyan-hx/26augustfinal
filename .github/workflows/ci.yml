name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: LumidDashboard/package-lock.json
      - run: npm ci
        working-directory: LumidDashboard
      - run: npm run lint
        working-directory: LumidDashboard
      - run: npm run typecheck
        working-directory: LumidDashboard
      - run: npm test
        working-directory: LumidDashboard
      - run: npm run build
        working-directory: LumidDashboard
      - name: Bundle budget (initial JS < 200 KB gzipped)
        working-directory: LumidDashboard
        run: |
          size=$(gzip -c $(ls dist/assets/index-*.js) | wc -c)
          echo "initial JS gzipped: $size bytes"
          test "$size" -lt 204800

  database:
    name: Migrations + RLS/pgTAP tests
    # Pinned: postgresql-16 / pgtap packages are not published for newer ubuntu-latest images.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Postgres 16 + pgTAP
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-pgtap
      - run: PG_BIN=/usr/lib/postgresql/16/bin bash scripts/db-test.sh

  functions:
    name: Edge Functions typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.x
      - run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
